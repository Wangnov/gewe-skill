name: Release candidate

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to test, for example v0.1.0"
        required: true
        default: "v0.1.0"

permissions:
  contents: read

jobs:
  linux-archive-smoke:
    name: Linux archive smoke (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            musl: false
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-22.04
            musl: true
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
            musl: false
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-22.04-arm
            musl: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: matrix.musl
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Install cargo-dist
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/axodotdev/cargo-dist/releases/download/v0.31.0/cargo-dist-installer.sh \
            | sh

      - name: Build release archives
        run: |
          dist build --tag "${{ inputs.tag }}" --artifacts=local --target "${{ matrix.target }}"

      - name: Smoke test archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gewe-smoke"
          tar -xJf "target/distrib/gewe-skill-cli-${{ matrix.target }}.tar.xz" -C "$RUNNER_TEMP/gewe-smoke"
          tar -xJf "target/distrib/gewe-skill-memory-${{ matrix.target }}.tar.xz" -C "$RUNNER_TEMP/gewe-smoke"

          "$RUNNER_TEMP/gewe-smoke/gewe-skill-cli-${{ matrix.target }}/gewe-skill" --help >/dev/null

          export GEWE_SKILL_DATABASE_URL="sqlite:$RUNNER_TEMP/gewe-skill-memory.sqlite?mode=rwc"
          export GEWE_SKILL_LISTEN="127.0.0.1:18788"
          export GEWE_SKILL_READ_TOKEN="candidate-read-token"
          export GEWE_SKILL_WRITE_TOKEN="candidate-write-token"
          export GEWE_SKILL_ATTACHMENT_DIR="$RUNNER_TEMP/gewe-attachments"

          "$RUNNER_TEMP/gewe-smoke/gewe-skill-memory-${{ matrix.target }}/gewe-skill-memory" &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT

          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18788/healthz; then
              exit 0
            fi
            sleep 1
          done

          echo "memory service did not become healthy" >&2
          exit 1
