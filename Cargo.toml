[workspace]
resolver = "2"
members = []

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/wangnov/gewe-skill"
authors = ["Wangnov"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
lto = true
codegen-units = 1
strip = true
