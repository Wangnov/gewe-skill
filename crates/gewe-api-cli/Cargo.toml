[package]
name = "gewe-api-cli"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/wangnov/gewe-skill"
authors = ["Wangnov"]

[[bin]]
name = "gewe-api"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
hex = "0.4"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
